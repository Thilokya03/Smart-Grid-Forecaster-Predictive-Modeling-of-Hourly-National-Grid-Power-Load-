services:
  pipeline-ui:
    build: .
    container_name: uk-weather-pipeline-ui
    ports:
      - "8765:8765"
    environment:
      DEMAND_INPUT_FOLDER: /input/demand
      DASHBOARD_ADMIN_TOKEN: ${DASHBOARD_ADMIN_TOKEN:-}
      DASHBOARD_SUPER_ADMIN_TOKEN: ${DASHBOARD_SUPER_ADMIN_TOKEN:-}
      AUTO_PREDICTIONS_ENABLED: ${AUTO_PREDICTIONS_ENABLED:-true}
      AUTO_PREDICTION_INTERVAL_HOURS: ${AUTO_PREDICTION_INTERVAL_HOURS:-6}
      AUTO_PREDICTION_RUN_ON_START: ${AUTO_PREDICTION_RUN_ON_START:-false}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ${USERPROFILE}/Downloads:/input/demand:ro
    restart: unless-stopped
