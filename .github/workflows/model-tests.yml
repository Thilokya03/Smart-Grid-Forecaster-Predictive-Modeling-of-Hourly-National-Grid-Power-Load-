name: Model tests

on:
  push:
    paths:
      - ".github/workflows/model-tests.yml"
      - "models/**"
      - "scripts/**"
      - "tests/**"
      - "Notebooks/timesfm_forecasting.ipynb"
      - "requirements*.txt"
  pull_request:
    paths:
      - ".github/workflows/model-tests.yml"
      - "models/**"
      - "scripts/**"
      - "tests/**"
      - "Notebooks/timesfm_forecasting.ipynb"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          python -m pip cache purge || true
          df -h

      - name: Upgrade pip
        run: python -m pip install --no-cache-dir --upgrade pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --no-cache-dir "torch==2.9.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install core test dependencies
        run: |
          python -m pip install --no-cache-dir \
            matplotlib \
            numpy \
            pandas \
            requests \
            "pytest>=9.0" \
            scikit-learn \
            "SQLAlchemy==2.0.43" \
            "xgboost-cpu==3.2.0"

      - name: Install TimesFM
        run: python -m pip install --no-cache-dir "timesfm==2.0.2"

      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c "import torch, xgboost; assert torch.version.cuda is None; assert xgboost.__version__ == '3.2.0'"

      - name: Compile Python sources
        run: python -m compileall -q models scripts tests

      - name: Run model tests
        run: pytest
