name: Update forecast data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-forecast-data.yml"
      - "weather_pipeline/**"
      - "uk_training_data_prep/**"
      - "models/prophet/fast_gap_fill_and_forecast.py"
      - "ui/pipeline_runner.py"
      - "ui/pipeline_health.py"
      - "requirements-render.txt"
  schedule:
    - cron: "17 0,6,12,18 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-forecast-data
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DEMAND_INPUT_FOLDER: data/raw/neso
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
      PIPELINE_STEP_RETRY_ATTEMPTS: "3"
      PIPELINE_STEP_RETRY_DELAY_SECONDS: "10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-render.txt

      - name: Refresh demand, weather, features, and forecasts
        id: pipeline
        continue-on-error: true
        run: python -m ui.pipeline_runner

      - name: Create forecast-update PR and merge after tests pass
        id: publish
        if: steps.pipeline.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data artifacts results/fast_predictions
          if git diff --cached --quiet; then
            echo "No data or artifact changes to commit."
          else
            update_branch="automation/forecast-update-${GITHUB_RUN_ID}"
            git switch -c "$update_branch"
            git commit -m "Update forecast data [skip ci]"
            git push --set-upstream origin "$update_branch"
            pr_url="$(gh pr create \
              --base main \
              --head "$update_branch" \
              --title "Update forecast data" \
              --body "Automated forecast-data refresh from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.")"
            pr_number="$(gh pr view "$update_branch" --json number --jq .number)"
            echo "Created $pr_url"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

            # A workflow dispatch is used because pushes made with GITHUB_TOKEN
            # do not start other push workflows. The dispatched test run is
            # attached to this PR branch and satisfies its required check.
            gh workflow run model-tests.yml --ref "$update_branch"
            for attempt in {1..30}; do
              test_run_id="$(gh run list \
                --workflow model-tests.yml \
                --branch "$update_branch" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId')"
              if [ -n "$test_run_id" ]; then
                break
              fi
              sleep 10
            done
            if [ -z "${test_run_id:-}" ]; then
              echo "::error::The Model tests workflow did not start for PR #$pr_number."
              exit 1
            fi
            gh run watch "$test_run_id" --exit-status
            gh pr merge "$pr_number" --squash --delete-branch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Render deployment when a hook is configured
        if: steps.publish.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          else
            echo "::notice::No deploy hook configured. Render Auto-Deploy must be set to On Commit."
          fi

      - name: Upload failed-refresh diagnostics
        if: steps.pipeline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-refresh-diagnostics-${{ github.run_id }}
          path: artifacts/pipeline_status
          if-no-files-found: warn
          retention-days: 14

      - name: Mark incomplete refresh as failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The refresh failed. Diagnostics were uploaded as a workflow artifact."
          exit 1
