<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · UK Smart Grid Forecast</title>
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <main class="login-shell">
    <a class="home-link" href="/">← Public forecast</a>
    <div class="brand"><span class="brand-icon">↗</span><span>UK Smart Grid<br><strong>Forecast</strong></span></div>
    <section class="login-card">
      <p class="eyebrow">SECURE ACCESS</p>
      <h1>Welcome back</h1>
      <p class="intro">Your access token was accepted. Choose how to sign in.</p>
      <button id="continueWithToken" class="primary" type="button" hidden>Continue with access token to set up the first account</button>
      <div id="bootstrapDivider" class="divider" hidden><span>or use your account</span></div>
      <form id="passwordForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
        <button class="primary" type="submit">Sign in with email</button>
      </form>
      <div class="divider"><span>or</span></div>
      <div id="googleButton" aria-label="Sign in with Google"></div>
      <p id="googleUnavailable" class="hint" hidden>Google sign in is not configured yet.</p>
      <button id="changeToken" type="button">Use a different access token</button>
      <p id="loginMessage" role="alert" aria-live="polite"></p>
    </section>
    <p class="footnote">Access is granted by a super admin. Contact one if you need an account.</p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
