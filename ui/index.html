<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Data Update</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="toolbar" aria-label="Weather data controls">
        <div>
          <p class="eyebrow">Smart Grid Forecaster</p>
          <h1>Weather Data</h1>
        </div>

        <div class="status-block">
          <span class="status-label">Last updated</span>
          <strong id="lastUpdated">Not updated yet</strong>
        </div>

        <button id="updateButton" type="button" class="primary-button">
          Update Weather Data
        </button>
      </section>

      <section class="summary-grid" aria-label="Weather data summary">
        <div class="summary-item">
          <span>Rows</span>
          <strong id="rowCount">0</strong>
        </div>
        <div class="summary-item">
          <span>Range start</span>
          <strong id="rangeStart">-</strong>
        </div>
        <div class="summary-item">
          <span>Range end</span>
          <strong id="rangeEnd">-</strong>
        </div>
        <div class="summary-item">
          <span>Source</span>
          <strong>Dummy local data</strong>
        </div>
      </section>

      <section class="table-section" aria-label="Weather data preview">
        <div class="table-title-row">
          <h2>Top 5 and Bottom 5 Rows</h2>
          <span id="tableHint">Click update to load one week of hourly data.</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
